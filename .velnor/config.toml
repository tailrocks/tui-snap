# Generated by Velnor Actions 0.1.0; edit .velnor/config.toml and regenerate.
schema = 1

# Velnor replaces the entire .github tree on generate. Keep CODEOWNERS at the
# repository root or under docs/ (both are GitHub-recognized); anything inside
# .github is removed.

[workflow]
policy = "consumer-v1"
# Explicit: actions/checkout creates no origin/HEAD, so never rely on it.
default_branch = "main"
# Compat pin: ubuntu-24.04 is the runner this repo's CI budget and lanes
# were qualified on; the ubuntu-26.04 default is unqualified here.
runner_label = "ubuntu-24.04"

# Optional resource limits for generated jobs.
# [resources]
# compiler_process_budget = 2           # MBX/Cargo compiler process budget.
# test_process_budget = 2               # Test process budget per generated lane.

# Optional test partitioning. Keep one shard unless measurement justifies more.
# [test_sharding]
# default_shards = 1                    # Default number of test partitions.
# by_manifest = {}                      # Manifest path to shard-count overrides.

# Optional exact registered stack IDs to suppress after detection.
# [stacks]
# ignore = []                           # Example: ["rust"].

[stacks.rust]
# Feature isolation: every crate is checked under default features and under
# --no-default-features (empty features vec renders exactly that flag).
configurations = [
  { name = "default", features = ["default"], target = "host" },
  { name = "no-default", features = [], target = "host" },
]
# Sticky: plain Cargo. Durable repo evidence (mise tasks, docs) invokes Cargo;
# MBX appeared only in the deleted old-generator output, and the generator's
# catalog MBX pin would reintroduce the repo/catalog version-skew class.
compile_driver = "cargo"
# Sticky: Nextest, matching durable .config/nextest.toml ([profile.ci]).
test_runner = "cargo_nextest"
# Repo-wide gates as `mise run <name>` steps appended to every crate job
# (sorted, unique; each also runnable locally). Native obligations already
# cover fmt/clippy/build/nextest/doctest/doc per crate and configuration.
# NOTE (upstream bug, tracked for velnor-new#1 feedback): native per-crate
# doc steps do NOT carry RUSTDOCFLAGS (cargo_env defines it but the renderer
# never emits it), so ci-rustdoc (workspace doc, warnings denied) remains
# the real rustdoc gate until the generator wires the env through.
# custom_tasks = ["alint", "ci-check-all-features", "ci-deny", "ci-no-default-graph", "ci-package", "ci-rustdoc", "ci-xtask-deps", "ci-xtask-policy"]

# Optional repository-relative POSIX globs excluded before detector input.
[discovery]
# Test-data fixture workspaces: exercised through their parent crate's tests,
# never standalone CI units.
exclude = ["crates/tuiscotti-fixtures/tests/fixtures/**"]

# Optional exact action-pin overrides. Omitted names use Velnor's bundled latest pins.
# [actions.overrides]
# "jdx/mise-action" = { version = "v5.0.0", sha = "9149ea85001c7435d5a66bb127d6a1b6227cb0a5" }
# "actions/checkout" = { version = "v7.0.1", sha = "3d3c42e5aac5ba805825da76410c181273ba90b1" }
# "actions/cache/restore" = { version = "v6.1.0", sha = "55cc8345863c7cc4c66a329aec7e433d2d1c52a9" }
# "actions/cache/save" = { version = "v6.1.0", sha = "55cc8345863c7cc4c66a329aec7e433d2d1c52a9" }
# "actions/upload-artifact" = { version = "v7.0.1", sha = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" }
# "actions/download-artifact" = { version = "v8.0.1", sha = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" }
# "jdx/mr-boxington-action" = { version = "v1.5.0", sha = "9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3" }
# Values must be an allowlisted action's matching release version and full SHA.
