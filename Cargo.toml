[workspace]
members = [
    "crates/tuiscotti-core",
    "crates/tuiscotti-render",
    "crates/tuiscotti-runtime",
    "crates/tuiscotti-insta",
    "crates/tuiscotti",
    "crates/tuiscotti-cli",
    "crates/tuiscotti-fixtures",
    "crates/xtask",
]
resolver = "3"

[workspace.dependencies]
# Centralize all actual dependencies here, including dev/build dependencies.
# Use real compatible released versions; termpane must come from the official registry release.
# Pins below are the exact resolved versions from the pre-split Cargo.lock.
anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = "=0.29.0"
fontdue = "=0.9.4"
image = "=0.25.10"
image-compare = "=0.5.0"
insta = { version = "=1.48.0", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
unicode-width = "=0.2.2"
# PTY runtime backend, temporarily retained under tuiscotti-runtime only (G1 swap later).
portable-pty = "=0.9.0"
alacritty_terminal = "=0.26.0"
libc = "=0.2.189"
tempfile = "=3.27.0"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
