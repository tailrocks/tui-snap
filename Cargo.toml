[package]
name = "tuisnap"
version = "0.2.0"
edition = "2021"
description = "Rust TUI visual-regression toolkit: Ratatui view dumps + PTY captures sharing one canonical frame, real-glyph PNGs, HTML expected/actual/diff reports"
license = "Apache-2.0"

[[bin]]
name = "tuisnap"
path = "src/main.rs"
required-features = ["pty"]

[lib]
name = "tuisnap"
path = "src/lib.rs"

[features]
default = ["pty"]
# PTY engine + raw-stream replay. Pure view tests build and run with
# `--no-default-features` (no termlens/termpane in that closure).
pty = ["dep:termlens", "dep:termpane"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
insta = { version = "1.48", default-features = false, features = ["json"] }
image = "0.25"
image-compare = "0.5"
fontdue = "0.9"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
termlens = { version = "0.9", path = "vendor/termlens", optional = true }
termpane = { git = "https://github.com/tailrocks/termpane", tag = "v0.1.0", optional = true }

[dev-dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
tempfile = "3"
