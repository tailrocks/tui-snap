[workspace]
members = [
    "crates/tuiscotti-core",
    "crates/tuiscotti-render",
    "crates/tuiscotti-runtime",
    "crates/tuiscotti-insta",
    "crates/tuiscotti",
    "crates/tuiscotti-cli",
    "crates/tuiscotti-fixtures",
    "crates/tuiscotti-bench",
    "crates/xtask",
]
resolver = "3"

[workspace.dependencies]
# Centralize all actual dependencies here, including dev/build dependencies.
# Use real compatible released versions; termpane must come from the official registry release.
# Pins below are the exact resolved versions from the pre-split Cargo.lock.
anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = "=0.28.1"
fs2 = "=0.4.3"
swash = "=0.2.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "gif"] }
image-compare = "=0.5.0"
insta = { version = "=1.48.0", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "underline-color"] }
unicode-width = "=0.2.0"
# PTY runtime backend: released termpane from crates.io (G1 swap landed, F01).
termpane = { version = "=0.1.0", features = ["pty"] }
tempfile = "=3.27.0"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tailrocks/tui-snap"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.test]
# g7: a one-file view touch rebuilds 5 test-profile units (fixtures lib +
# view_contracts + 3 PTY fixture binaries coupled via CARGO_BIN_EXE). Full
# DWARF emission for all five is pure verdict-gate overhead, so test builds
# keep line tables only (failure backtraces stay file:line-accurate).
# Dev/release profiles keep full debuginfo.
debug = "line-tables-only"
