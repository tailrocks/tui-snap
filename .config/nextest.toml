# tui-snap nextest configuration (N02-N10).
# Default profile: plain `cargo nextest run` fast lane.
# CI profile: no retries (failures stay visible), JUnit for evidence
# correlation, leaky PTY tests fail instead of passing silently.

[profile.default]
fail-fast = false
retries = 0

[profile.ci]
fail-fast = false
retries = 0
flaky-result = "fail"
leak-timeout = { period = "500ms", result = "fail" }

[profile.ci.junit]
path = "junit.xml"

[test-groups]
# Genuinely scarce resource: concurrent PTY sessions. Initial tuning,
# not a universal optimum. Only heavy PTY binaries join this group.
terminal-e2e = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(tui) | binary(journey) | binary(runner)'
test-group = 'terminal-e2e'

[[profile.ci.overrides]]
filter = 'binary(tui) | binary(journey) | binary(runner)'
test-group = 'terminal-e2e'
