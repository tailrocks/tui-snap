[package]
name = "tuiscotti-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tuiscotti"
path = "src/main.rs"

# No required-features: the binary always builds. Offline commands (inspect,
# render, diff, review, accept, report, import, trace) work without `pty`;
# PTY-backed machine ops report `unsupported` instead.
[features]
default = ["pty"]
pty = ["tuiscotti/pty"]

[dependencies]
# default-features = false: without the CLI `pty` feature this must not
# compile the terminal runtime (offline render/diff/report/import only).
tuiscotti = { version = "0.2.0", path = "../tuiscotti", default-features = false }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
