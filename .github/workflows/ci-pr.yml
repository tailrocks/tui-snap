          EXCLUDED: ${{ needs.plan.outputs.excluded }}
          EXPECTED_CALLERS: "[{\"job_id\":\"github-hosted-rust-policy\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-policy\"},{\"job_id\":\"github-hosted-rust-tuiscotti\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-tuiscotti\"},{\"job_id\":\"github-hosted-rust-tuiscotti-cli\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-tuiscotti-cli\"},{\"job_id\":\"github-hosted-rust-tuiscotti-core\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-tuiscotti-core\"},{\"job_id\":\"github-hosted-rust-tuiscotti-fixtures\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-tuiscotti-fixtures\"},{\"job_id\":\"github-hosted-rust-tuiscotti-insta\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-tuiscotti-insta\"},{\"job_id\":\"github-hosted-rust-tuiscotti-render\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-tuiscotti-render\"},{\"job_id\":\"github-hosted-rust-tuiscotti-runtime\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-tuiscotti-runtime\"},{\"job_id\":\"github-hosted-rust-xtask\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-xtask\"}]"
