schema = 2

[generator]
repository = "tailrocks/tui-snap"
revision = "be61acbbbfb71db6b51337e547e39de049d4fc15"

# Public repo: GitHub-hosted singleton (no velnor lanes).
# (donbeave/tui-snap is a redirect; the repo lives in tailrocks.)
# No scan excludes: vendor/termlens was removed in 4d02e2e (R04), so
# the former vendor/** exclude is dead. tools/*.py carry no project
# markers, so the scan derives no unit from them and no exclude is
# needed.
[scan]
exclude = []

[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
ruleset_external_status_checks = ["DCO"]

# Repo shape/line gate (G7): alint runs as its own CI unit through the
# canonical extension point — a declared [[units]] row naming a mise task
# (ci_tasks) plus the mise tool id that provisions the binary (mise_tools
# must equal a mise.lock key exactly). Pattern mirrors velnor-workflow's own
# `reuse` fixture (kind = "docs" renders the generic legacy-step unit that
# bootstraps mise tools, then runs `mise run alint` at the unit root).
# Per-unit pr_commands overrides are refused by the generator ("generation
# config is not a workflow programming language"), so one unit with a
# shape-covering watch is the sound wiring — not alint pasted into every
# rust unit (which would also collapse their typed fmt/clippy/test phases).
[[units]]
id = "repo-shape"
kind = "docs"
root = "."
label = "Repo shape and line gates (alint)"
watch = [
  ".alint.yml",
  "AGENTS.md",
  "CODEOWNERS",
  "Cargo.toml",
  "Cargo.lock",
  "clippy.toml",
  "deny.toml",
  "rustfmt.toml",
  ".config/nextest.toml",
  "mise.toml",
  "mise.lock",
  "crates/*/Cargo.toml",
  "**/*.rs",
  "**/*.py",
  "**/*.pyi",
  "**/*.js",
  "**/*.mjs",
  "**/*.cjs",
  "**/*.jsx",
  "**/*.ts",
  "**/*.tsx",
  "**/package.json",
  "**/pyproject.toml",
]
ci_tasks = ["alint"]
mise_tools = ["rust", "cargo:alint"]

# The xtask negative-enforcement tests shell out to `alint`; provision the
# binary for that unit (override restates the scanned nextest tool and adds
# alint — overrides replace the field, and both ids must equal mise.lock
# keys). Typed fmt/clippy/test phases are untouched: only ci_tasks collapses
# a unit to the legacy step.
[[units]]
id = "rust-xtask"
mise_tools = ["rust", "aqua:nextest-rs/nextest/cargo-nextest", "cargo:alint"]

# F13 CI lanes (P-A5/P-C2/P-D1/P-B4/P-UMB). Each lane is a declared docs-kind
# unit rendering the generic legacy step (`mise run <task>`), the same
# mechanism as `repo-shape` above. Tasks live in mise.toml, run online (fresh
# runners have no cargo cache), and are each verified locally.
#
# Non-knobs (probed against the pinned generator; do NOT re-add): the mr-box
# 1.12.0 version is baked into the generator (`mbx` is a boolean, `[workflow]`
# rejects `mbx_version`), so the mise 1.20.0 skew (P-B2) cannot reconcile
# here — both sides stay exact-pinned until a generator upgrade. Likewise
# `tool_version` on `rust-policy` lands in project.toml but the deny install
# stays bare `tool: cargo-deny` (P-A3), and ci_tasks on a detected unit
# appends rather than replaces, so the deny lane cannot be re-pinned from
# this file either.
[[units]]
id = "rustdoc-gate"
kind = "docs"
root = "."
label = "Rustdoc gate (workspace docs, warnings denied)"
watch = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/*/Cargo.toml",
  "rust-toolchain",
  "rust-toolchain.toml",
  "mise.toml",
  "mise.lock",
  "**/*.rs",
]
ci_tasks = ["ci-rustdoc"]
mise_tools = ["rust"]

[[units]]
id = "no-default-gate"
kind = "docs"
root = "."
label = "No-default-features isolation gate"
watch = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/*/Cargo.toml",
  "rust-toolchain",
  "rust-toolchain.toml",
  "mise.toml",
  "mise.lock",
  ".config/nextest.toml",
  "**/*.rs",
]
ci_tasks = ["ci-no-default"]
# alint: the full-suite phase runs xtask negative-enforcement tests, which
# spawn `alint` (same precedent as rust-xtask above).
mise_tools = ["rust", "aqua:nextest-rs/nextest/cargo-nextest", "cargo:alint"]

# Policy walks the whole tree (foreign-script/shebang detection), so this
# unit takes the broad repo-shape watch.
[[units]]
id = "xtask-gates"
kind = "docs"
root = "."
label = "xtask umbrella (policy, deps, package)"
watch = [
  ".alint.yml",
  "AGENTS.md",
  "CODEOWNERS",
  "Cargo.toml",
  "Cargo.lock",
  "clippy.toml",
  "deny.toml",
  "rustfmt.toml",
  ".config/nextest.toml",
  "mise.toml",
  "mise.lock",
  "rust-toolchain",
  "rust-toolchain.toml",
  "crates/*/Cargo.toml",
  "**/*.rs",
  "**/*.py",
  "**/*.pyi",
  "**/*.js",
  "**/*.mjs",
  "**/*.cjs",
  "**/*.jsx",
  "**/*.ts",
  "**/*.tsx",
  "**/package.json",
  "**/pyproject.toml",
]
ci_tasks = ["ci-xtask-policy", "ci-xtask-deps", "ci-package"]
mise_tools = ["rust"]

# MSRV floor: rust-version 1.98 is declared in every manifest; the task
# installs runner rustup toolchain 1.98.0 and builds+tests everything with
# `rustup run` (airtight under rust-toolchain.toml; `cargo +toolchain`
# would depend on shim routing). Runner-provided rustup is already assumed
# by the generated rust units (`rustup toolchain install --profile minimal`).
[[units]]
id = "msrv-gate"
kind = "docs"
root = "."
label = "MSRV floor gate (1.98.0 builds and tests all)"
watch = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/*/Cargo.toml",
  "rust-toolchain",
  "rust-toolchain.toml",
  "mise.toml",
  "mise.lock",
  ".config/nextest.toml",
  "**/*.rs",
]
ci_tasks = ["ci-msrv"]
# alint: the full-suite phase runs xtask negative-enforcement tests, which
# spawn `alint` (same precedent as rust-xtask above).
mise_tools = ["rust", "aqua:nextest-rs/nextest/cargo-nextest", "cargo:alint"]
