schema = 2

[generator]
repository = "tailrocks/tui-snap"
revision = "be61acbbbfb71db6b51337e547e39de049d4fc15"

# Public repo: GitHub-hosted singleton (no velnor lanes).
# (donbeave/tui-snap is a redirect; the repo lives in tailrocks.)
# No scan excludes: vendor/termlens was removed in 4d02e2e (R04), so
# the former vendor/** exclude is dead. tools/*.py carry no project
# markers, so the scan derives no unit from them and no exclude is
# needed.
[scan]
exclude = []

[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
ruleset_external_status_checks = ["DCO"]

# Repo shape/line gate (G7): alint runs as its own CI unit through the
# canonical extension point — a declared [[units]] row naming a mise task
# (ci_tasks) plus the mise tool id that provisions the binary (mise_tools
# must equal a mise.lock key exactly). Pattern mirrors velnor-workflow's own
# `reuse` fixture (kind = "docs" renders the generic legacy-step unit that
# bootstraps mise tools, then runs `mise run alint` at the unit root).
# Per-unit pr_commands overrides are refused by the generator ("generation
# config is not a workflow programming language"), so one unit with a
# shape-covering watch is the sound wiring — not alint pasted into every
# rust unit (which would also collapse their typed fmt/clippy/test phases).
[[units]]
id = "repo-shape"
kind = "docs"
root = "."
label = "Repo shape and line gates (alint)"
watch = [
  ".alint.yml",
  "AGENTS.md",
  "CODEOWNERS",
  "Cargo.toml",
  "Cargo.lock",
  "clippy.toml",
  "deny.toml",
  "rustfmt.toml",
  ".config/nextest.toml",
  "mise.toml",
  "mise.lock",
  "crates/*/Cargo.toml",
  "**/*.rs",
  "**/*.py",
  "**/*.pyi",
  "**/*.js",
  "**/*.mjs",
  "**/*.cjs",
  "**/*.jsx",
  "**/*.ts",
  "**/*.tsx",
  "**/package.json",
  "**/pyproject.toml",
]
ci_tasks = ["alint"]
mise_tools = ["cargo:alint"]

# The xtask negative-enforcement tests shell out to `alint`; provision the
# binary for that unit (override restates the scanned nextest tool and adds
# alint — overrides replace the field, and both ids must equal mise.lock
# keys). Typed fmt/clippy/test phases are untouched: only ci_tasks collapses
# a unit to the legacy step.
[[units]]
id = "rust-xtask"
mise_tools = ["aqua:nextest-rs/nextest/cargo-nextest", "cargo:alint"]
